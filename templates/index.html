<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soket Mimarisi Laboratuvarı | Çift İstemci</title>
    <!-- Stil Dosyaları -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Socket.IO İstemci Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>
    <div class="ambient-background"></div>
    
    <div class="main-wrapper">
        <!-- 1. İSTEMCİ PANELİ -->
        <div class="chat-container glass-panel" id="client1-ui">
            <header class="app-header" style="padding-bottom: 0.5rem;">
                <h1 class="gradient-text" style="font-size: 1.5rem;">Kullanıcı 1</h1>
                <div class="user-control" style="margin-top: 5px;">
                    <span id="currentUser1">Bağlanıyor...</span>
                    <button id="changeNameBtn1" class="btn btn-small">Ayarla</button>
                </div>
            </header>

            <div class="chat-window scroller" id="messageArea1">
                <!-- Mesajlar Buraya Düşecek -->
            </div>

            <div class="input-area">
                <div class="file-preview-container" id="filePreview1" style="display: none;">
                    <span id="fileNameDisplay1">dosya.jpg</span>
                    <button id="removeFileBtn1" class="remove-btn">✖</button>
                </div>
                
                <form id="chatForm1">
                    <label for="fileInput1" class="btn file-btn" title="Dosya Ekle">📎</label>
                    <input type="file" id="fileInput1" style="display: none;">
                    
                    <input type="text" id="messageInput1" placeholder="Mesaj yaz..." autocomplete="off">
                    <button type="submit" class="btn btn-primary" id="sendBtn1">Gönder</button>
                </form>
            </div>
        </div>

        <!-- ORTAK LOG PANELİ -->
        <div class="socket-log-panel glass-panel">
            <header class="app-header log-header" style="padding-bottom: 0.5rem;">
                <h2 class="gradient-text" style="font-size: 1.5rem;">Mimarisi Logları</h2>
                <p style="margin: 0;">Soket Yönlendirme Trafiği</p>
            </header>
            <div class="log-window scroller" id="logArea">
                <div class="log-entry system-log">
                    <span class="log-time">--:--:--</span>
                    <span class="log-event">[SYSTEM]</span>
                    <span class="log-detail">Ağ dinleniyor... İki istemci açılıyor.</span>
                </div>
            </div>
        </div>

        <!-- 2. İSTEMCİ PANELİ -->
        <div class="chat-container glass-panel" id="client2-ui">
            <header class="app-header" style="padding-bottom: 0.5rem;">
                <h1 class="gradient-text" style="font-size: 1.5rem;">Kullanıcı 2</h1>
                <div class="user-control" style="margin-top: 5px;">
                    <span id="currentUser2">Bağlanıyor...</span>
                    <button id="changeNameBtn2" class="btn btn-small">Ayarla</button>
                </div>
            </header>

            <div class="chat-window scroller" id="messageArea2">
                <!-- Mesajlar Buraya Düşecek -->
            </div>

            <div class="input-area">
                <div class="file-preview-container" id="filePreview2" style="display: none;">
                    <span id="fileNameDisplay2">dosya.jpg</span>
                    <button id="removeFileBtn2" class="remove-btn">✖</button>
                </div>
                
                <form id="chatForm2">
                    <label for="fileInput2" class="btn file-btn" title="Dosya Ekle">📎</label>
                    <input type="file" id="fileInput2" style="display: none;">
                    
                    <input type="text" id="messageInput2" placeholder="Mesaj yaz..." autocomplete="off">
                    <button type="submit" class="btn btn-primary" id="sendBtn2">Gönder</button>
                </form>
            </div>
        </div>
    </div>

    <!-- İsim Değiştirme Modal (Popup) -->
    <div id="nameModal" class="modal-overlay" style="display: none;">
        <div class="modal glass-panel">
            <h3>İstemci İsmini Belirle</h3>
            <input type="text" id="newNameInput" placeholder="Yeni isminiz" maxlength="20">
            <div class="modal-actions">
                <button id="cancelNameBtn" class="btn">İptal</button>
                <button id="saveNameBtn" class="btn btn-primary">Kaydet</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
